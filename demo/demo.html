<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Demo — System Architecture</title>
<style>
  :root {
    --bg: #f7f8fa; --panel: #ffffff; --fg: #1f2329; --muted: #6b7280;
    --line: #d0d5dd; --accent: #4f6ef7; --accent-soft: #eef1fe;
    --node-fill: #ffffff; --node-stroke: #c3c9d4;
  }
  html[data-theme="dark"] {
    --bg: #14161a; --panel: #1d2026; --fg: #e6e8eb; --muted: #9096a1;
    --line: #3a3f47; --accent: #7c93ff; --accent-soft: #262c40;
    --node-fill: #22262e; --node-stroke: #454b56;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column;
    transition: background .2s, color .2s;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; flex: 1; }
  header .tag { font-size: 11px; color: var(--muted); }
  button, select {
    font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  main { flex: 1; display: flex; min-height: 0; }
  #canvas-wrap { flex: 1; overflow: hidden; position: relative; cursor: grab; }
  #canvas-wrap.dragging { cursor: grabbing; }
  svg { width: 100%; height: 100%; display: block; user-select: none; }
  .node rect {
    fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1.5; rx: 8;
    transition: fill .2s, stroke .2s;
  }
  .node:hover rect, .node.active rect { stroke: var(--accent); stroke-width: 2; }
  .node text { fill: var(--fg); font-size: 13px; pointer-events: none; }
  .node text.sub { fill: var(--muted); font-size: 10.5px; }
  .edge { stroke: var(--line); stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  #detail {
    width: 260px; border-left: 1px solid var(--line); background: var(--panel);
    padding: 16px; overflow: auto; transition: background .2s;
  }
  #detail h2 { font-size: 14px; margin: 0 0 8px; }
  #detail p { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin: 0 0 10px; }
  #detail .kbd { font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
  @media (max-width: 720px) { #detail { display: none; } }
</style>
</head>
<body>
<header>
  <h1>System Architecture <span class="tag">archify demo</span></h1>
  <select id="theme">
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>
  <button id="zoom-in">＋</button>
  <button id="zoom-out">－</button>
  <button id="reset">Reset</button>
</header>
<main>
  <div id="canvas-wrap">
    <svg id="svg" viewBox="0 0 900 520" aria-label="Architecture diagram">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"></path>
        </marker>
      </defs>
      <g id="viewport">
        <path class="edge" d="M 200 130 C 300 130, 330 130, 420 130"></path>
        <path class="edge" d="M 600 130 C 680 130, 700 130, 760 130"></path>
        <path class="edge" d="M 510 175 C 510 250, 300 250, 220 300"></path>
        <path class="edge" d="M 510 175 C 510 250, 720 250, 780 300"></path>
        <g class="node" data-title="Client Layer"
           data-desc="Web / mobile clients rendered from the same note-linked diagram. Click nodes to inspect. Drag to pan, wheel to zoom.">
          <rect x="60" y="90" width="180" height="80"></rect>
          <text x="150" y="125" text-anchor="middle">Client Layer</text>
          <text x="150" y="145" text-anchor="middle" class="sub">Web · iOS · Android</text>
        </g>
        <g class="node" data-title="API Gateway"
           data-desc="Single entry point: auth, rate limiting, request routing to backend services.">
          <rect x="380" y="90" width="180" height="80"></rect>
          <text x="470" y="125" text-anchor="middle">API Gateway</text>
          <text x="470" y="145" text-anchor="middle" class="sub">auth · rate-limit · routing</text>
        </g>
        <g class="node" data-title="Service Mesh"
           data-desc="Domain services (orders, users, billing) with health checks and observability baked in.">
          <rect x="720" y="90" width="170" height="80"></rect>
          <text x="805" y="125" text-anchor="middle">Service Mesh</text>
          <text x="805" y="145" text-anchor="middle" class="sub">orders · users · billing</text>
        </g>
        <g class="node" data-title="Primary Database"
           data-desc="Transactional store for core entities. Backed up continuously, read replicas offload reporting.">
          <rect x="130" y="300" width="180" height="80"></rect>
          <text x="220" y="335" text-anchor="middle">Primary Database</text>
          <text x="220" y="355" text-anchor="middle" class="sub">OLTP · replicas</text>
        </g>
        <g class="node" data-title="Event / Cache Tier"
           data-desc="Redis cache plus an event bus for async workflows and cache invalidation.">
          <rect x="690" y="300" width="180" height="80"></rect>
          <text x="780" y="335" text-anchor="middle">Event / Cache Tier</text>
          <text x="780" y="355" text-anchor="middle" class="sub">Redis · event bus</text>
        </g>
      </g>
    </svg>
  </div>
  <aside id="detail">
    <h2 id="d-title">System Architecture</h2>
    <p id="d-desc">A self-contained interactive demo in the style of an Archify artifact. Click any node to inspect it.</p>
    <p class="kbd">Drag: pan · Wheel: zoom · Theme toggle in the toolbar</p>
  </aside>
</main>
<script>
(function () {
  "use strict";
  var svg = document.getElementById("svg");
  var viewport = document.getElementById("viewport");
  var wrap = document.getElementById("canvas-wrap");
  var themeSel = document.getElementById("theme");

  // --- theme -------------------------------------------------------------
  themeSel.addEventListener("change", function () {
    document.documentElement.setAttribute("data-theme", themeSel.value);
  });

  // --- pan / zoom --------------------------------------------------------
  var scale = 1, tx = 0, ty = 0, dragging = false, lastX = 0, lastY = 0;
  function apply() {
    viewport.setAttribute("transform", "translate(" + tx + "," + ty + ") scale(" + scale + ")");
  }
  wrap.addEventListener("pointerdown", function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    wrap.classList.add("dragging");
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    tx += e.clientX - lastX; ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    apply();
  });
  wrap.addEventListener("pointerup", function () { dragging = false; wrap.classList.remove("dragging"); });
  wrap.addEventListener("wheel", function (e) {
    e.preventDefault();
    scale = Math.min(3, Math.max(0.4, scale * (e.deltaY < 0 ? 1.1 : 0.9)));
    apply();
  }, { passive: false });
  document.getElementById("zoom-in").addEventListener("click", function () {
    scale = Math.min(3, scale * 1.2); apply();
  });
  document.getElementById("zoom-out").addEventListener("click", function () {
    scale = Math.max(0.4, scale / 1.2); apply();
  });
  document.getElementById("reset").addEventListener("click", function () {
    scale = 1; tx = 0; ty = 0; apply();
  });

  // --- node detail -------------------------------------------------------
  var dTitle = document.getElementById("d-title"), dDesc = document.getElementById("d-desc");
  Array.prototype.forEach.call(document.querySelectorAll(".node"), function (node) {
    node.addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll(".node"), function (n) { n.classList.remove("active"); });
      node.classList.add("active");
      dTitle.textContent = node.getAttribute("data-title");
      dDesc.textContent = node.getAttribute("data-desc");
    });
  });
})();
</script>
</body>
</html>
